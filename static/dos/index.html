
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />

    <!-- Existing DOS stylesheets -->
    <link rel="stylesheet" href="/emulator/dos/styles.css" />
    <link rel="stylesheet" href="/emulator/dos/js-dos.css" />

    <!-- Password screen stylesheet -->
    <link rel="stylesheet" href="/css/password.css" />

    <!-- js-dos -->
    <script src="/emulator/dos/js-dos.js"></script>

    <title>DOS Loader | Unblocked on CCPorted</title>
    <meta name="robots" content="noindex, nofollow" />
  </head>

  <body>

    <!-- PASSWORD SCREEN -->
    <div id="password-screen">
      <div class="password-box">

        <h1>Welcome</h1>

        <p>Please enter the password to continue.</p>

        <form id="password-form">

          <input
            type="password"
            id="password-input"
            placeholder="Enter password"
            autocomplete="off"
            required
          />

          <button id="password-button" type="submit">
            ENTER
          </button>

          <div id="password-error">
            Incorrect password. Please try again.
          </div>

        </form>

      </div>
    </div>

    <!-- EXISTING DOS LOADER -->
    <div id="container">
      <div id="subContainer">

        <div id="gameContainer" width="640" height="400"></div>

        <div id="fullScreenBar">
          <h3 id="gameFName">DOS Loader</h3>

          <div class="actions">

            <div id="save">
              <img src="/assets/images/save.png" alt="Save" />
            </div>

            <div id="fullscreen">
              <img src="/assets/images/fullscreen.png" alt="Fullscreen" />
            </div>

          </div>
        </div>

      </div>
    </div>

    <!-- Existing DOS script -->
    <script src="/emulator/dos/script.js"></script>

    <!-- Password functionality -->
    <script src="/js/password.js"></script>

  </body>
</html>
